<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campus Knowledge Assistant - Admin</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">
            Campus Knowledge Assistant
        </span>

        <span class="text-white">
            Admin Dashboard
        </span>
    </div>
</nav>

<div class="container py-5">

    <h2 class="mb-4">Dashboard</h2>

    <div class="row g-4">

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6>Documents</h6>
                    <h2 id="documents">-</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6>Total Users</h6>
                    <h2 id="users">-</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6>Professors</h6>
                    <h2 id="professors">-</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6>Active Users</h6>
                    <h2 id="active-users">-</h2>
                </div>
            </div>
        </div>

    </div>

    <div class="card shadow-sm mt-5">

        <div class="card-header">
            Upload University Document
        </div>

        <div class="card-body">

            <form id="upload-form">

                <div class="mb-3">
                    <label class="form-label">
                        Document title
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="title"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Year
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        name="year"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        PDF
                    </label>

                    <input
                        type="file"
                        class="form-control"
                        name="file"
                        accept=".pdf"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Upload Document
                </button>

            </form>

            <div
                id="message"
                class="mt-3"
            ></div>

        </div>

    </div>

</div>

<script>

async function loadDashboard() {

    // const token = localStorage.getItem("access_token");

    // if (!token) {
    //     window.location.href = "/docs";
    //     return;
    // }

    const response = await fetch(
        "/admin/dashboard",
        {
            headers: {
                "Authorization":
                    `Bearer ${token}`
            }
        }
    );

    if (!response.ok) {
        alert("Admin authentication required.");
        return;
    }

    const data = await response.json();

    document.getElementById(
        "documents"
    ).textContent = data.documents;

    document.getElementById(
        "users"
    ).textContent = data.users;

    document.getElementById(
        "professors"
    ).textContent = data.professors;

    document.getElementById(
        "active-users"
    ).textContent = data.active_users;
}


document.getElementById(
    "upload-form"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const token =
            localStorage.getItem(
                "access_token"
            );

        const formData =
            new FormData(this);

        const response = await fetch(
            "/admin/documents/upload",
            {
                method: "POST",
                headers: {
                    "Authorization":
                        `Bearer ${token}`
                },
                body: formData
            }
        );

        const data =
            await response.json();

        const message =
            document.getElementById(
                "message"
            );

        if (response.ok) {

            message.innerHTML =
                `<div class="alert alert-success">
                    ${data.message}
                    Version ${data.version} created.
                </div>`;

            this.reset();

        } else {

            message.innerHTML =
                `<div class="alert alert-danger">
                    ${data.detail || "Upload failed."}
                </div>`;
        }
    }
);

loadDashboard();

</script>

</body>
</html>
